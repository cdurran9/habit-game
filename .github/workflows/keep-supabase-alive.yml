name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC — well within the 7-day pause window
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          # 200 = ok, 401 = unauthorized (still means DB is awake), anything else is a problem
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "Unexpected status — project may be paused or URL is wrong"
            exit 1
          fi
